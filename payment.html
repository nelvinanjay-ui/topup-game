<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran - TopUpKu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="section card">

  <h2>💳 Pembayaran</h2>

  <p>Pesanan kamu sudah dibuat.</p>

  <div class="payment-list">

    <button class="payment-option" onclick="choosePayment('DANA')">
      💙 DANA
    </button>

    <button class="payment-option" onclick="choosePayment('GoPay')">
      💚 GoPay
    </button>

    <button class="payment-option" onclick="choosePayment('OVO')">
      💜 OVO
    </button>

    <button class="payment-option" onclick="choosePayment('QRIS')">
      📱 QRIS
    </button>

  </div>

  <div id="paymentResult" class="result"></div>

  <div id="orderDetail" class="result" style="display:none;">

    <h3>📋 Detail Pesanan</h3>

    <p><b>Nomor Pesanan:</b> <span id="detailOrder">-</span></p>
    <p><b>Game:</b> <span id="detailGame">-</span></p>
    <p><b>ID Player:</b> <span id="detailPlayer">-</span></p>
    <p><b>Zone:</b> <span id="detailZone">-</span></p>
    <p><b>Nominal:</b> <span id="detailNominal">-</span></p>
    <p><b>Harga:</b> <span id="detailPrice">-</span></p>
    <p><b>Pembayaran:</b> <span id="detailPayment">-</span></p>

    <div id="paymentInstruction"></div>

    <hr>

    <p id="orderStatus">
      🕐 <b>Status:</b> Menunggu pembayaran
    </p>

    <button class="btn full" onclick="demoPayment()">
      💳 Bayar Sekarang
    </button>

    <div id="paymentStatus"></div>

  </div>

  <button class="btn full" onclick="history.back()">
    ← Kembali
  </button>

</section>

<script>

function choosePayment(method) {

  const data = JSON.parse(localStorage.getItem("orderData"));

  let instruction = "";

  if (method === "QRIS") {

    instruction =
      "<h3>📱 Pembayaran QRIS</h3>" +
      "<p>Scan QRIS untuk melanjutkan pembayaran.</p>" +
      "<p>⚠️ QRIS masih dalam mode demo.</p>";

  } else {

    instruction =
      "<h3>💳 Instruksi Pembayaran</h3>" +
      "<p>Metode: <b>" + method + "</b></p>" +
      "<p>⚠️ Pembayaran masih dalam mode demo.</p>";

  }

  document.getElementById("paymentInstruction").innerHTML = instruction;

  document.getElementById("paymentResult").innerHTML =
    "✅ Metode pembayaran dipilih: <b>" + method + "</b>";

  if (data) {

    document.getElementById("detailOrder").textContent =
      data.orderNumber;

    document.getElementById("detailGame").textContent =
      data.game;

    document.getElementById("detailPlayer").textContent =
      data.playerId;

    document.getElementById("detailZone").textContent =
      data.zone;

    document.getElementById("detailNominal").textContent =
      data.nominal;

    document.getElementById("detailPrice").textContent =
      "Rp" + data.price.toLocaleString("id-ID");

  }

  document.getElementById("detailPayment").textContent = method;

  document.getElementById("orderDetail").style.display = "block";

}


function demoPayment() {

  document.getElementById("orderStatus").innerHTML =
    "✅ <b>Status:</b> Pembayaran Berhasil";

  document.getElementById("paymentStatus").innerHTML =
    "<br>✅ Pembayaran berhasil (Demo)<br>" +
    "Pesanan kamu sedang diproses.";

}

</script>

</body>
</html>
