<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pembayaran - TopUpKu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h2 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      color: #777;
      margin-bottom: 0;
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin-top: 22px;
    }

    .payment-list {
      display: grid;
      gap: 10px;
      margin: 15px 0;
    }

    .payment-option {
      width: 100%;
      padding: 16px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: 0.2s;
    }

    .payment-option:hover {
      border-color: #6c5ce7;
    }

    .payment-option.active {
      border-color: #6c5ce7;
      background: #f1efff;
    }

    .invoice {
      margin-top: 20px;
      border: 1px solid #e5e5e5;
      border-radius: 15px;
      overflow: hidden;
    }

    .invoice-header {
      background: #6c5ce7;
      color: white;
      padding: 18px;
    }

    .invoice-header h3 {
      margin: 0 0 5px;
    }

    .invoice-header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .invoice-body {
      padding: 18px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #777;
    }
