<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pembayaran - TopUpKu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #222;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .payment-option {
      border: 2px solid #ddd;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .payment-option:hover {
      border-color: #4f46e5;
    }

    .payment-option.selected {
      border-color: #4f46e5;
      background: #f0f0ff;
    }

    .payment-option input {
      margin-right: 10px;
    }

    .pay-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .pay-button:hover {
      background: #3730a3;
    }

    #success {
      display: none;
      text-align: center;
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Pembayaran</h1>
    <p class="subtitle">Pilih metode pembayaran kamu</p>

    <div class="payment-option" onclick="selectPayment(this)">
      <input type="radio" name="payment" value="DANA">
      DANA
    </div>

    <div class="payment-option" onclick="selectPayment(this)">
      <input type="radio" name="payment" value="GoPay">
      GoPay
    </div>

    <div class="payment-option" onclick="selectPayment(this)">
      <input type="radio" name="payment" value="OVO">
      OVO
    </div>

    <div class="payment-option" onclick="selectPayment(this)">
      <input type="radio" name="payment" value="QRIS">
      QRIS
    </div>

    <button class="pay-button" onclick="bayarSekarang()">
      Bayar Sekarang
    </button>

    <div id="success">
      ✅ Pembayaran Berhasil!<br><br>
      Pesanan kamu sudah dibuat.
    </div>

  </div>

  <script>
    function selectPayment(element) {
      document.querySelectorAll(".payment-option").forEach(function(option) {
        option.classList.remove("selected");
      });

      element.classList.add("selected");
      element.querySelector("input").checked = true;
    }

    function bayarSekarang() {
      const payment = document.querySelector(
        'input[name="payment"]:checked'
      );

      if (!payment) {
        alert("Silakan pilih metode pembayaran terlebih dahulu!");
        return;
      }

      document.getElementById("success").style.display = "block";
    }
  </script>

</body>
        </html>
