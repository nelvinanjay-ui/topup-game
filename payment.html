<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran - TopUpKu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h2 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      color: #777;
      margin-bottom: 0;
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin-top: 22px;
    }

    .payment-list {
      display: grid;
      gap: 10px;
      margin: 15px 0;
    }

    .payment-option {
      width: 100%;
      padding: 16px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
    }

    .payment-option.active {
      border-color: #6c5ce7;
      background: #f1efff;
    }

    .invoice {
      margin-top: 20px;
      border: 1px solid #e5e5e5;
      border-radius: 15px;
      overflow: hidden;
    }

    .invoice-header {
      background: #6c5ce7;
      color: white;
      padding: 18px;
    }

    .invoice-header h3 {
      margin: 0 0 5px;
    }

    .invoice-header p {
      margin: 0;
      font-size: 14px;
    }

    .invoice-body {
      padding: 18px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #777;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .total {
      font-size: 20px;
      color: #6c5ce7;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: #fff8df;
      border-radius: 12px;
      text-align: center;
    }

    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      background: #6c5ce7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .btn.back {
      background: #eee;
      color: #333;
    }

    .demo {
      margin-top: 15px;
      font-size: 13px;
      color: #777;
      text-align: center;
    }

    #qris {
      display: none;
      margin-top: 15px;
      text-align: center;
    }

    .fake-qr {
      width: 180px;
      height: 180px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 8px solid #111;
      background:
        repeating-linear-gradient(
          45deg,
          #fff,
          #fff 6px,
          #111 6px,
          #111 10px
        );
      font-weight: bold;
      color: #111;
    }
