<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran - TopUpKu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
    }

    .payment-list {
      display: grid;
      gap: 12px;
      margin: 20px 0;
    }

    .payment-option {
      width: 100%;
      padding: 16px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      position: relative;
      z-index: 10;
    }

    .payment-option:active {
      background: #eee;
    }

    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #6c5ce7;
      color: white;
      font-size: 16px;
      cursor: pointer;
      position: relative;
      z-index: 10;
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      background: #f5f3ff;
      border-radius: 10px;
    }

    #orderDetail {
      display: none;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>💳 Pembayaran</h2>

  <p>Pesanan kamu sudah dibuat.</p>

  <div class="payment-list">

    <button type="button" class="payment-option" onclick="choosePayment('DANA')">
      💙 DANA
    </button>

    <button type="button" class="payment-option" onclick="choosePayment('GoPay')">
      💚 GoPay
    </button>

    <button type="button" class="payment-option" onclick="choosePayment('OVO')">
      💜 OVO
    </button>

    <button type="button" class="payment-option" onclick="choosePayment('QRIS')">
      📱 QRIS
    </button>

  </div>

  <div id="paymentResult"></div>

  <div id="orderDetail" class="result">

    <h3>📋 Detail Pesanan</h3>

    <p>Nomor Pesanan: <b id="detailOrder">-</b></p>
    <p>Game: <b id="detailGame">-</b></p>
    <p>ID Player: <b id="detailPlayer">-</b></p>
    <p>Zone: <b id="detailZone">-</b></p>
    <p>Nominal: <b id="detailNominal">-</b></p>
    <p>Harga: <b id="detailPrice">-</b></p>
    <p>Pembayaran: <b id="detailPayment">-</b></p>

    <div id="paymentInstruction"></div>

    <hr>

    <p>🕐 <b>Status:</b> Menunggu pembayaran</p>

  </div>

  <button type="button" class="btn" onclick="demoPayment()">
    💳 Bayar Sekarang
  </button>

  <div id="paymentStatus"></div>

  <button type="button" class="btn" onclick="history.back()">
    ← Kembali
  </button>

</div>

<script>

function choosePayment(method) {

  const data = JSON.parse(localStorage.getItem("orderData"));

  let instruction = "";

  if (method === "QRIS") {

    instruction =
      "<h3>📱 Pembayaran QRIS</h3>" +
      "<p>Scan QRIS untuk melanjutkan pembayaran.</p>" +
      "<p>⚠️ QRIS masih dalam mode demo.</p>";

  } else {

    instruction =
      "<h3>💳 Instruksi Pembayaran</h3>" +
      "<p>Metode: <b>" + method + "</b></p>" +
      "<p>⚠️ Pembayaran masih dalam mode demo.</p>";

  }

  document.getElementById("paymentInstruction").innerHTML = instruction;

  document.getElementById("paymentResult").innerHTML =
    "✅ Metode pembayaran dipilih: <b>" + method + "</b>";

  if (data) {

    document.getElementById("detailOrder").textContent =
      data.orderNumber;

    document.getElementById("detailGame").textContent =
      data.game;

    document.getElementById("detailPlayer").textContent =
      data.playerId;

    document.getElementById("detailZone").textContent =
      data.zone;

    document.getElementById("detailNominal").textContent =
      data.nominal;

    document.getElementById("detailPrice").textContent =
      "Rp" + data.price.toLocaleString("id-ID");

  }

  document.getElementById("detailPayment").textContent = method;

  document.getElementById("orderDetail").style.display = "block";
}


function demoPayment() {

  document.getElementById("paymentStatus").innerHTML =
    "<div class='result'>" +
    "✅ <b>Pembayaran berhasil (Demo)</b><br><br>" +
    "Pesanan kamu sedang diproses." +
    "</div>";

}

</script>

</body>
</html>
