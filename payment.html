<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran - TopUpKu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
    }

    .payment-list {
      display: grid;
      gap: 12px;
      margin: 20px 0;
    }

    .payment-option {
      width: 100%;
      padding: 16px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .payment-option.active {
      border-color: #6c5ce7;
      background: #f1efff;
    }

    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #6c5ce7;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      background: #f5f3ff;
      border-radius: 10px;
    }

    .waiting {
      padding: 12px;
      background: #fff3cd;
      border-radius: 10px;
      margin-top: 15px;
    }

    .success {
      padding: 15px;
      background: #d4edda;
      border-radius: 10px;
      margin-top: 15px;
    }

    .qris-box {
      text-align: center;
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
      border: 2px solid #ddd;
    }

    .fake-qr {
      width: 180px;
      height: 180px;
      margin: 15px auto;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 2px;
      background: white;
      padding: 8px;
      border: 2px solid #222;
    }

    .fake-qr span {
      background: #222;
    }

    .fake-qr span:nth-child(3n) {
      background: white;
    }

    .timer {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin: 15px 0;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>💳 Pembayaran</h2>

  <p>Silakan pilih metode pembayaran.</p>

  <div class="payment-list">

    <button type="button" class="payment-option"
      onclick="choosePayment('DANA', this)">
      💙 DANA
    </button>

    <button type="button" class="payment-option"
      onclick="choosePayment('GoPay', this)">
      💚 GoPay
    </button>

    <button type="button" class="payment-option"
      onclick="choosePayment('OVO', this)">
      💜 OVO
    </button>

    <button type="button" class="payment-option"
      onclick="choosePayment('QRIS', this)">
      📱 QRIS
    </button>

  </div>

  <div id="paymentResult"></div>

  <div id="orderDetail" class="result">

    <h3>📋 Detail Pesanan</h3>

    <p>Nomor Pesanan: <b id="detailOrder">-</b></p>
    <p>Game: <b id="detailGame">-</b></p>
    <p>ID Player: <b id="detailPlayer">-</b></p>
    <p>Zone: <b id="detailZone">-</b></p>
    <p>Nominal: <b id="detailNominal">-</b></p>

    <div class="price" id="detailPrice">
      Rp0
    </div>

    <p>Pembayaran: <b id="detailPayment">-</b></p>

  </div>

  <div id="paymentInstruction"></div>

  <div class="waiting" id="waiting">
  🕐 <b>Status:</b> Menunggu pembayaran
  <div class="timer">
    Sisa waktu: <span id="countdown">15:00</span>
  </div>
  </div>

  <button type="button" class="btn" onclick="demoPayment()">
    💳 Bayar Sekarang
  </button>

  <div id="paymentStatus"></div>

  <button type="button" class="btn" onclick="history.back()">
    ← Kembali
  </button>

</div>


<script>

let selectedMethod = "";


/* Ambil data pesanan */

const data = JSON.parse(localStorage.getItem("orderData"));

if (data) {

  document.getElementById("detailOrder").textContent =
    data.orderNumber;

  document.getElementById("detailGame").textContent =
    data.game;

  document.getElementById("detailPlayer").textContent =
    data.playerId;

  document.getElementById("detailZone").textContent =
    data.zone;

  document.getElementById("detailNominal").textContent =
    data.nominal;

  document.getElementById("detailPrice").textContent =
    "Rp" + data.price.toLocaleString("id-ID");

}


/* Pilih pembayaran */

function choosePayment(method, button) {

  selectedMethod = method;

  document.querySelectorAll(".payment-option").forEach(function(btn) {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  document.getElementById("detailPayment").textContent =
    method;

  document.getElementById("paymentResult").innerHTML =
    "<div class='result'>✅ Metode pembayaran dipilih: <b>" +
    method +
    "</b></div>";


  if (method === "QRIS") {

    document.getElementById("paymentInstruction").innerHTML =

      "<div class='qris-box'>" +

      "<h3>📱 Scan QRIS</h3>" +

      "<p>Gunakan aplikasi pembayaran yang mendukung QRIS.</p>" +

      "<div class='fake-qr'>";

    for (let i = 0; i < 100; i++) {

      document.getElementById("paymentInstruction").innerHTML +=
        "<span></span>";

    }

    document.getElementById("paymentInstruction").innerHTML +=

      "</div>" +

      "<p><b>QRIS DEMO</b></p>" +
      "<p>⚠️ Ini hanya simulasi dan bukan QRIS pembayaran asli.</p>" +

      "</div>";

  } else {

    document.getElementById("paymentInstruction").innerHTML =

      "<div class='result'>" +

      "<h3>💳 Instruksi Pembayaran</h3>" +

      "<p>Metode: <b>" + method + "</b></p>" +

      "<p>Silakan lakukan pembayaran melalui aplikasi " +
      method + ".</p>" +

      "<p>⚠️ Mode demo — belum ada transaksi uang asli.</p>" +

      "</div>";

  }

}


/* Tombol bayar */

function demoPayment() {

  if (selectedMethod === "") {

    document.getElementById("paymentStatus").innerHTML =

      "<div class='result'>⚠️ Pilih metode pembayaran terlebih dahulu.</div>";

    return;

  }


  document.getElementById("waiting").style.display =
    "none";


  document.getElementById("paymentStatus").innerHTML =

    "<div class='success'>" +

    "✅ <b>Pembayaran Berhasil!</b><br><br>" +

    "Pesanan kamu sedang diproses.<br>" +

    "Metode: <b>" + selectedMethod + "</b><br><br>" +

    "🎮 Top up akan diproses dalam mode demo." +

    "</div>";

}

</script>

</body>
</html>
